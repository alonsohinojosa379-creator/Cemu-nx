name: EXE NX masters (Windows x64)

# Actions -> "EXE NX masters (Windows x64)" -> Run workflow. El .exe queda en Artifacts.
on:
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compilar
        working-directory: exe
        shell: bash
        run: |
          set +e
          (npm install && npm run bundle && node smoke.js && npx electron-builder --win portable --x64 --publish never) > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -n -i -E "error|fail|cannot|invalid|warn|nsis|makensis" build.log | head -n 30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Fallo del build::$msg"
            exit $rc
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NXmasters-exe
          path: exe/dist/NXmasters-Creador.exe
          retention-days: 14
