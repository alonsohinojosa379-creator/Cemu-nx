name: EXE NX masters (Windows x64)

# Actions -> "EXE NX masters (Windows x64)" -> Run workflow. El .exe queda en Artifacts.
on:
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compilar
        working-directory: exe
        run: |
          npm install
          npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NXmasters-exe
          path: exe/dist/NXmasters-Creador.exe
          retention-days: 14
